version: "3.8"

networks:
  booking-net:
    driver: bridge

services:
  postgresql:
    image: postgres:16-alpine
    container_name: booking_db_container
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./user-service/db_init/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - booking-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: booking_redis_container
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - booking-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: booking_rabbitmq_container
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - booking-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: user_service_container
    restart: always
    environment:
      PORT: 3003
      DB_HOST: postgresql
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - booking-net
    expose:
      - "3003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  booking-core-service:
    build:
      context: ./booking-core-service
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: booking_core_service_container
    restart: always
    environment:
      PORT: 3001
      RABBITMQ_HOST: rabbitmq 
      DB_HOST: postgresql
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      JWT_SECRET: ${JWT_SECRET} 
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - booking-net
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/core/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s 

  booking-api:
    build:
      context: ./booking-api
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: booking_api_container
    restart: always
    environment:
      PORT: 3000
      CORE_SERVICE_URL: http://booking-core-service:3001
      USER_SERVICE_URL: http://user-service:3003
    depends_on:
      user-service:
        condition: service_healthy
      booking-core-service:
        condition: service_healthy
    networks:
      - booking-net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  booking-ui:
    build:
      context: ./booking-ui
      dockerfile: Dockerfile
    container_name: booking_ui_container
    restart: always
    ports:
      - "8080:80"
    depends_on:
      booking-api:
        condition: service_healthy
    networks:
      - booking-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
