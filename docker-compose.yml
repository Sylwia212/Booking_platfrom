# booking-platform/docker-compose.yml
version: '3.8'

# Definicja sieci niestandardowej
networks:
  booking-net:
    driver: bridge

services:
  # Usługa Bazy Danych PostgreSQL
  postgresql:
    image: postgres:16-alpine
    container_name: booking_db_container
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - booking-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Usługa Pamięci Podręcznej Redis
  redis:
    image: redis:7-alpine
    container_name: booking_redis_container
    restart: always
    # Użycie zmiennej środowiskowej dla hasła Redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - booking-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Usługa Kolejki Komunikatów RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: booking_rabbitmq_container
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - booking-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s # Zmienione z 20s na 60s

  # Usługa Backendowa (API Gateway)
  booking-api:
    build:
      context: ./booking-api
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: booking_api_container
    restart: always
    environment:
      PORT: 3000
      CORE_SERVICE_URL: http://booking-core-service:3001
      DB_HOST: postgresql
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD} # Przekazywanie hasła z .env
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD} # Przekazywanie hasła z .env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - booking-net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Usługa Dedykowana (Logika Biznesowa)
  booking-core-service:
    build:
      context: ./booking-core-service
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: booking_core_service_container
    restart: always
    environment:
      PORT: 3001
      RABBITMQ_HOST: rabbitmq
      DB_HOST: postgresql
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD} # Przekazywanie hasła z .env
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD} # Przekazywanie hasła z .env
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER} # Przekazywanie użytkownika RabbitMQ
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS} # Przekazywanie hasła RabbitMQ
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - booking-net
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Usługa Frontendowa (UI)
  booking-ui:
    build:
      context: ./booking-ui
      dockerfile: Dockerfile
    container_name: booking_ui_container
    restart: always
    ports:
      - "8080:80" # TUTAJ ZMIENIONO PORT Z 80:80 na 8080:80
    depends_on:
      booking-api:
        condition: service_healthy
    networks:
      - booking-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"] # Ta linia nie wymaga zmiany portu na 8080, bo to wewnątrz kontenera jest
      interval: 10s
      timeout: 5s
      retries: 5

# Definicja wolumenów dla trwałości danych
volumes:
  postgres_data:
  redis_data: