apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    type: Recreate 
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
          name: redis 
          protocol: TCP
        env: 
        - name: REDIS_PASSWORD 
          valueFrom:
            secretKeyRef:
              name: redis-credentials 
              key: REDIS_PASSWORD    
        args: 
          - redis-server
          - --requirepass
          - $(REDIS_PASSWORD) 
        livenessProbe:
          tcpSocket:
            port: redis 
          initialDelaySeconds: 15 
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: redis
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: redis-data-volume 
          mountPath: /data 
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes: 
      - name: redis-data-volume
        persistentVolumeClaim:
          claimName: redis-pvc 