apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
data:
  KC_DB: "postgres"
  KC_DB_URL_HOST: "postgresql-service" 
  KC_DB_URL_DATABASE: "keycloak_db"    
  KC_DB_SCHEMA: "public"
  KC_HOSTNAME_STRICT: "false"         
  KC_HOSTNAME_STRICT_HTTPS: "false" 
  KC_HTTP_ENABLED: "true"
  KC_HTTP_PORT: "8080"                
  KC_PROXY: "edge"                    
  KC_HOSTNAME_FRONTEND_URL: "http://localhost:8181"

  KEYCLOAK_INTERNAL_URL_FOR_API: "http://keycloak-service:8080" 
  KEYCLOAK_PUBLIC_URL_FOR_API: "http://localhost:8181" 
  KEYCLOAK_REALM_NAME_FOR_API: "booking-app-realm"       